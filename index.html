  <script>
// ==========================================
// 1. Grab DOM Elements
// ==========================================
const playBtn = document.getElementById('play-btn');
const pauseBtn = document.getElementById('pause-btn');
const muteBtn = document.getElementById('mute-btn');
const seekBar = document.querySelector('.seek-bar');
const volSlider = document.querySelector('.vol-slider');
const bassSlider = document.getElementById('bass-slider'); // NEW: Bass Slider Element
const songSelector = document.getElementById('songSelector');
const albumNameDisplay = document.getElementById('album-name');
const albumArtDisplay = document.getElementById('album-art');
const audio = document.getElementById('audio-player'); 

// ==========================================
// 2. Visualizer & Pipeline Variables
// ==========================================
const canvas = document.getElementById('visualizer');
const canvasCtx = canvas.getContext('2d');

let audioCtx;
let analyser;
let sourceNode;       
let audioBuffer;     
let startTime = 0;   
let startOffset = 0; 
let isPlaying = false;
let gainNode;        
let progressInterval; 
let bassFilter; // NEW: Audio node to process low frequencies
let subBassFilter; // NEW: Secondary filter node variable

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) - 1;
    let x = 0;

    const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
    gradient.addColorStop(0, '#000000');
    gradient.addColorStop(0.6, '#00ff00');
    gradient.addColorStop(1, '#ffffff');
    canvasCtx.fillStyle = gradient;

    for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
    }
}

// ==========================================
// 3. Audio Control Pipeline Functions
// ==========================================
function initAudioEngine() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128; 

        // 1. Core Low-Shelf Filter (Boosts general bass shelf)
        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = "lowshelf";
        bassFilter.frequency.setValueAtTime(200, audioCtx.currentTime); 
        bassFilter.gain.setValueAtTime(bassSlider.value, audioCtx.currentTime); 

        // 2. NEW: Sub-Bass Peaking Filter (Pumps the deep, hard-hitting kick drum frequencies)
        subBassFilter = audioCtx.createBiquadFilter();
        subBassFilter.type = "peaking";
        subBassFilter.frequency.setValueAtTime(80, audioCtx.currentTime); // Hard targets the deepest sub-bass area (80Hz)
        subBassFilter.Q.setValueAtTime(1.0, audioCtx.currentTime);        // Controls the tightness of the bass wave spike
        subBassFilter.gain.setValueAtTime(bassSlider.value, audioCtx.currentTime); 

        gainNode = audioCtx.createGain();

        // RECONFIGURED EXTREME PIPELINE: 
        // Source ➡️ BassFilter ➡️ SubBassFilter ➡️ Analyser ➡️ Volume Gain ➡️ Speakers
        bassFilter.connect(subBassFilter);
        subBassFilter.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        drawVisualizer();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}


function startProgressTimer() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (isPlaying && audioBuffer) {
            const currentPlaybackTime = startOffset + (audioCtx.currentTime - startTime);
            if (currentPlaybackTime >= audioBuffer.duration) {
                seekBar.value = 100;
                stopProgressTimer();
            } else {
                seekBar.value = (currentPlaybackTime / audioBuffer.duration) * 100;
            }
        }
    }, 100);
}

function stopProgressTimer() {
    clearInterval(progressInterval);
}

function playSongInMemory() {
    if (!audioBuffer || isPlaying) return;
    initAudioEngine();

    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    
    // Connect to the bass filter instead of standard analyser channel
    sourceNode.connect(bassFilter);

    if (gainNode) {
        gainNode.gain.value = volSlider.value / 100;
    }

    startTime = audioCtx.currentTime;
    sourceNode.start(0, startOffset);
    isPlaying = true;

    startProgressTimer();

    sourceNode.onended = () => {
        const currentPlaybackTime = startOffset + (audioCtx.currentTime - startTime);
        if (isPlaying && currentPlaybackTime >= audioBuffer.duration - 0.1) {
            isPlaying = false;
            startOffset = 0;
            seekBar.value = 0;
            stopProgressTimer();
        }
    };
}

function pauseSongInMemory() {
    if (!isPlaying || !sourceNode) return;
    startOffset += audioCtx.currentTime - startTime;
    stopProgressTimer();
    sourceNode.onended = null;
    sourceNode.stop();
    sourceNode = null;
    isPlaying = false;
}

// ==========================================
// 4. Control Interface Listeners
// ==========================================
playBtn.addEventListener('click', () => { playSongInMemory(); });
pauseBtn.addEventListener('click', () => { pauseSongInMemory(); });

muteBtn.addEventListener('click', () => {
    if (!gainNode) return;
    if (gainNode.gain.value > 0) {
        gainNode.gain.value = 0;
        muteBtn.textContent = 'Unmute';
    } else {
        gainNode.gain.value = volSlider.value / 100;
        muteBtn.textContent = 'Mute';
    }
});

seekBar.addEventListener('input', () => {
    if (!audioBuffer) return;
    const wasPlaying = isPlaying;
    if (isPlaying) pauseSongInMemory();
    startOffset = (seekBar.value / 100) * audioBuffer.duration;
    if (wasPlaying) playSongInMemory();
});

volSlider.addEventListener('input', () => {
    if (gainNode) gainNode.gain.value = volSlider.value / 100;
});

// NEW: Bass Booster Slider Event Listener
bassSlider.addEventListener('input', () => {
    if (bassFilter && audioCtx) {
        // Dynamically changes low-end volume between 0dB (normal) and +15dB (extreme bass boost)
        bassFilter.gain.setValueAtTime(bassSlider.value, audioCtx.currentTime);
    }
});

// ==========================================
// 5. Native Code: Embedded Image Finder
// ==========================================
function parseEmbeddedArt(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    if (bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return null;

    for (let i = 0; i < bytes.length - 4; i++) {
        if (bytes[i] === 0xFF && bytes[i+1] === 0xD8 && bytes[i+2] === 0xFF) {
            const imageBytes = bytes.subarray(i);
            const blob = new Blob([imageBytes], { type: 'image/jpeg' });
            return URL.createObjectURL(blob);
        }
        if (bytes[i] === 0x89 && bytes[i+1] === 0x50 && bytes[i+2] === 0x4E && bytes[i+3] === 0x47) {
            const imageBytes = bytes.subarray(i);
            const blob = new Blob([imageBytes], { type: 'image/png' });
            return URL.createObjectURL(blob);
        }
    }
    return null;
}

// ==========================================
// 6. File Selection Logic (Zero Dependencies)
// ==========================================
songSelector.addEventListener('change', (event) => {
    const file = event.target.files[0]; 

    if (file) {
        const originalName = file.name;
        const lastDotIndex = originalName.lastIndexOf('.');
        albumNameDisplay.textContent = lastDotIndex !== -1 ? originalName.substring(0, lastDotIndex) : originalName;

        const reader = new FileReader();
        
        reader.onload = function(e) {
            initAudioEngine();
            const arrayBuffer = e.target.result;

            const coverArtUrl = parseEmbeddedArt(arrayBuffer);
            
            if (coverArtUrl) {
                const tempImg = new Image();
                tempImg.onload = function() {
                    const canvasTemp = document.createElement('canvas');
                    const ctxTemp = canvasTemp.getContext('2d');
                    canvasTemp.width = tempImg.width;
                    canvasTemp.height = tempImg.height;
                    ctxTemp.drawImage(tempImg, 0, 0);
                    
                    albumArtDisplay.src = canvasTemp.toDataURL('image/jpeg');
                    URL.revokeObjectURL(coverArtUrl);
                };
                tempImg.src = coverArtUrl;
            } else {
                console.log("No embedded image found inside this track file.");
            }

            audioCtx.decodeAudioData(arrayBuffer, (decodedBuffer) => {
                if (isPlaying) pauseSongInMemory();
                stopProgressTimer();
                
                audioBuffer = decodedBuffer;
                startOffset = 0; 
                seekBar.value = 0;
                playSongInMemory(); 
            }, (error) => {
                console.error("Audio decoding failed:", error);
            });
        };

        reader.readAsArrayBuffer(file);
    }
});

  </script>
